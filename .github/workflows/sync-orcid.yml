name: Sync ORCID publications

on:
  workflow_dispatch:
    inputs:
      reset_publications:
        description: "Delete existing publication pages and PDFs before rebuilding from ORCID"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 08 * * *"

permissions:
  contents: write

concurrency:
  group: orcid-publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read ORCID and update publications
        run: python scripts/sync_orcid.py
        env:
          REBUILD_PUBLICATION_LIST: "false"
          ALLOW_ORCID_PDF_DOWNLOAD: "false"
          ORCID_ONLY: "true"
          PRUNE_NON_ORCID_CONTENT: "true"
          REMOVE_LOCAL_PDFS: "true"
          RESET_ORCID_PUBLICATIONS: ${{ inputs.reset_publications || 'false' }}
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          ORCID_ID: "0009-0009-5930-8265"

      - name: Save website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes found."
          else
            git commit -m "Sync ORCID publications"
            git push
          fi
